# Production stack — deploy lên VPS qua GitHub Actions.
# Image API được pull từ GHCR (build từ CI, không build trên server).
#
# File này KHÔNG tự đọc .env.example. Tạo file `.env` thật (cùng folder)
# với các secret thực tế trước khi `docker compose up`.

services:
  api:
    image: ${API_IMAGE:-ghcr.io/edu-nexus-exe/be:latest}
    container_name: edu-nexus-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
      AllowedHosts: "*"
      # Domain public để dựng URL portfolio chia sẻ (FR6.2). PHẢI set đúng domain thật,
      # nếu không link portfolio sẽ trỏ về default sai (https://edunexus.vn).
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-https://edunexus.vn}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-Edu-Nexus-Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Edu-Nexus-Clients}
      Jwt__AccessTokenDurationMinutes: ${JWT_ACCESS_MIN:-15}
      Jwt__RefreshTokenDurationDays: ${JWT_REFRESH_DAYS:-30}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Ai__Enabled: ${AI_ENABLED:-false}
      # Override AI theo từng pipeline (tuỳ chọn). Bỏ trống = dùng theo Ai__Enabled.
      # Bật/tắt riêng lẻ khi cần, vd chỉ tắt Roadmap: Ai__Pipelines__Roadmap=false
      # Ai__Pipelines__JdParse / CvParse / AssessmentGen / GapAnalysis / Roadmap / ResourceSuggest
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Embedding: "text-embedding-3-small"
      OpenAI__Models__Fast: "gpt-4o-mini"
      OpenAI__Models__Smart: "gpt-4o"
      OpenAI__MaxTokens__JdParse: 800
      OpenAI__MaxTokens__CvParse: 1000
      OpenAI__MaxTokens__Assessment: 3000
      OpenAI__MaxTokens__GapAnalysis: 1500
      OpenAI__MaxTokens__Roadmap: 4000
      OpenAI__MaxTokens__ResourceSuggestion: 600
      Rag__ChunkSize: 800
      Rag__ChunkOverlap: 100
      Rag__MinSimilarityScore: 0.65
      Rag__TopK: 5
      # Mảng truyền qua env bằng index __0/__1/__2 (set tường minh cho khớp appsettings).
      Rag__AllowedSourceTypes__0: "fptu_curriculum"
      Rag__AllowedSourceTypes__1: "fptu_syllabus"
      Rag__AllowedSourceTypes__2: "external_doc"
      # ---------- Swagger (FR: bật/tắt qua env trên prod, không sửa code) ----------
      # Đặt true để mở Swagger UI ở "/" trên production. Mặc định false (an toàn).
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # ---------- SePay (thanh toán) ----------
      # BẮT BUỘC cho payment: webhook xác thực bằng SePay__ApiKey; tạo VietQR dùng 3 field bank.
      SePay__ApiKey: ${SEPAY_API_KEY}
      SePay__BankAccount: ${SEPAY_BANK_ACCOUNT}
      SePay__BankCode: ${SEPAY_BANK_CODE}
      SePay__AccountName: ${SEPAY_ACCOUNT_NAME}
      # Thời hạn (phút) order pending trước khi job tự huỷ. Mặc định 30.
      SePay__OrderTtlMinutes: ${SEPAY_ORDER_TTL_MIN:-30}
      # ---------- Seed admin (DataSeeder tạo admin lúc startup) ----------
      # Bỏ trống SEED_ADMIN_EMAIL -> KHÔNG seed admin (an toàn). Điền để tạo admin lần đầu.
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL:-}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD:-}
      Seed__Admin__FullName: ${SEED_ADMIN_FULLNAME:-Edu-Nexus Admin}
    volumes:
      - api-uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: pgvector/pgvector:pg16
    container_name: edu-nexus-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"   # Chỉ mở cho localhost (SSH tunnel), KHÔNG mở ra Internet
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Postgres tự chạy mọi file *.sql trong /docker-entrypoint-initdb.d/ KHI volume rỗng (lần đầu init).
    # Sau đó volume có data → không chạy lại. Muốn re-init: `docker compose down -v` (XOÁ DATA).
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edu-nexus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  caddy:
    image: caddy:2-alpine
    container_name: edu-nexus-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  redis-data:
  api-uploads:
  caddy-data:
  caddy-config:
